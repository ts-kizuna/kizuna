name: Release

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    release:
        name: Create release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
            pull-requests: write
            issues: write
            id-token: write
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Authenticate with the registry
              env:
                  REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm config set "//npm.pkg.github.com/:_authToken" "$REGISTRY_TOKEN"

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: pnpm exec release-it --ci

            - name: Add contributors to release
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
                      const current = releases[0];
                      if (!current || (current.body || '').includes('### Contributors')) return;

                      // Collect contributors (name + GitHub handle) from the commits in this release.
                      let people = [];
                      const previous = releases[1];
                      if (previous) {
                          const compare = await github.rest.repos.compareCommitsWithBasehead({
                              owner,
                              repo,
                              basehead: `${previous.tag_name}...${current.tag_name}`,
                          });
                          people = compare.data.commits
                              .filter((commit) => commit.author && !commit.author.login.endsWith('[bot]'))
                              .map((commit) => ({
                                  login: commit.author.login,
                                  name: (commit.commit.author && commit.commit.author.name) || commit.author.login,
                              }));
                      } else {
                          const contributors = await github.paginate(github.rest.repos.listContributors, { owner, repo, per_page: 100 });
                          people = contributors
                              .filter((contributor) => !contributor.login.endsWith('[bot]'))
                              .map((contributor) => ({ login: contributor.login, name: contributor.login }));
                      }

                      const seen = new Set();
                      const unique = people.filter((person) => !seen.has(person.login) && seen.add(person.login));
                      if (!unique.length) return;

                      const list = unique.map((person) => `* ${person.name} (@${person.login})`).join('\n');
                      await github.rest.repos.updateRelease({
                          owner,
                          repo,
                          release_id: current.id,
                          body: `${current.body || ''}\n\n### Contributors\n\n${list}`,
                      });

            - name: Comment on released PRs and issues
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
                      const current = releases[0];
                      const previous = releases[1];
                      if (!current || !previous) return;

                      const compare = await github.rest.repos.compareCommitsWithBasehead({
                          owner,
                          repo,
                          basehead: `${previous.tag_name}...${current.tag_name}`,
                      });

                      // Squash-merged commits end with "(#123)" — grab the PR number from each.
                      const prNumbers = new Set();
                      for (const commit of compare.data.commits) {
                          const title = commit.commit.message.split('\n')[0];
                          const matches = [...title.matchAll(/\(#(\d+)\)/g)];
                          if (matches.length) prNumbers.add(Number(matches[matches.length - 1][1]));
                      }
                      if (!prNumbers.size) return;

                      // Comment on each PR and any issues it closed.
                      const targets = new Set(prNumbers);
                      for (const number of prNumbers) {
                          const result = await github.graphql(
                              `query ($owner: String!, $repo: String!, $number: Int!) {
                                  repository(owner: $owner, name: $repo) {
                                      pullRequest(number: $number) {
                                          closingIssuesReferences(first: 20) {
                                              nodes {
                                                  number
                                              }
                                          }
                                      }
                                  }
                              }`,
                              { owner, repo, number },
                          );
                          const issues = result.repository.pullRequest?.closingIssuesReferences?.nodes || [];
                          for (const issue of issues) targets.add(issue.number);
                      }

                      const marker = '<!-- released -->';
                      const body = `${marker}\nThis is included in version [${current.tag_name}](${current.html_url}).`;
                      for (const number of targets) {
                          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
                          if (comments.some((comment) => comment.body.includes(marker))) continue;
                          await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
                      }

    deploy-docs:
        name: Deploy docs
        needs: release
        uses: ./.github/workflows/deploy-docs.yaml
        secrets:
            VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
