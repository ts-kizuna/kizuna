name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Build packages
              run: pnpm -r --filter "./packages/*" build

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test:ts

    swift-e2e:
        name: Swift E2E
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build packages
              run: pnpm -r --filter "./packages/*" build

            - name: Typecheck
              run: pnpm typecheck

            - name: Generate Swift
              run: node packages/swift/dist/cli.mjs generate --contract apps/shared/src/contract.ts --out apps/swift-demo/swift/Sources/APIClient/APIClient.swift --namespace-name API

            - name: Swift E2E tests
              run: pnpm --filter @ts-kizuna-demo/swift exec tsx scripts/test.ts
