name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Lint, Build & Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Format check
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            - name: Build demos
              run: pnpm build:demos
              env:
                  NEXT_TELEMETRY_DISABLED: 1

            - name: Check package exports
              run: pnpm test:exports

            - name: Test
              run: pnpm test:ts

    swift-e2e:
        name: Swift E2E
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Swift E2E tests
              run: pnpm test:swift

    kotlin-e2e:
        name: Kotlin E2E
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Kotlin E2E tests
              run: pnpm test:kotlin
